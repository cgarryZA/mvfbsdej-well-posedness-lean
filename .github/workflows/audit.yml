name: Audit

# The MachineChecked audits of this repository, one per version of the paper, published together
# to its GitHub Pages after CI passes on main (or on a manual run):
#
# - /v1/: arXiv 2608.23203v1, built from the branch `audit-v1`, which is the Lean of commit
#   ba94c06 with only that audit's configuration added (its Lean is never changed);
# - /latest/: the latest manuscript, built from the commit CI passed on main.
#
# A deploy replaces the whole site, so every run builds both audits. The site's root serves the
# latest audit as well, so the links and listings that name the root keep working.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          # Each audit pins the MachineChecked release it is built with.
          - audit: v1
            ref: refs/heads/audit-v1
            machinechecked: "0.1.18"
          - audit: latest
            ref: ""
            machinechecked: "0.1.21"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # The v1 audit's branch differs from ba94c06 only in its audit configuration, and its
      # inventory differs from ba94c06's only in the claims' source pins (pinned at arXiv v1).
      - name: Check the v1 audit's branch
        if: matrix.audit == 'v1'
        run: |
          base=ba94c0613381b37a44a7378276f3b9398c010f56
          git diff --name-only "$base" HEAD
          if git diff --name-only "$base" HEAD | grep -Ev '^(machinechecked\.toml|acceptance/claims\.json|\.github/workflows/audit\.yml)$'; then
            echo "audit-v1 changes more than its audit configuration" >&2
            exit 1
          fi
          git show "$base:acceptance/claims.json" > "$RUNNER_TEMP/claims-base.json"
          python3 - "$RUNNER_TEMP/claims-base.json" <<'PY'
          import json, sys
          a = json.load(open(sys.argv[1]))
          b = json.load(open("acceptance/claims.json"))
          pins = {"source_sha256", "source_hash_scheme", "source_line_sha256", "source_region"}
          same = lambda c: {k: v for k, v in c.items() if k not in pins}
          assert a["note"] == b["note"] and a["papers"] == b["papers"], "the inventory's header differs"
          assert [same(c) for c in a["claims"]] == [same(c) for c in b["claims"]], \
              "the inventory differs from ba94c06's beyond the source pins"
          print(f"{len(b['claims'])} claims; only their source pins differ from ba94c06")
          PY

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | \
            sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The toolchain of `lean-toolchain`, retried: a dropped download would otherwise fail the
      # first `lake` command.
      - name: Install the Lean toolchain
        run: |
          for attempt in 1 2 3; do
            elan toolchain install "$(cat lean-toolchain)" && exit 0
            sleep 30
          done
          exit 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/node_modules
          df -h /

      # The build CI published for this commit (for v1, the one of ba94c06), from the
      # `build-cache` release; anything it lacks is rebuilt.
      - name: Restore the build
        env:
          PROOFLENS_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/lean_cache.py" \
            https://raw.githubusercontent.com/cgarryZA/MachineChecked/2d577fda5c42713980c3dafe6c46560c02e3330d/scripts/lean_cache.py
          lake exe cache get
          python3 "$RUNNER_TEMP/lean_cache.py" restore . "${{ github.repository }}" \
            || echo "no compatible cached build; building from source"
          lake build --rehash

      - name: Install TeX Live
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended lmodern latexmk poppler-utils

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `build` probes the built Lean and compiles the manuscript; `export` writes the public
      # audit (reader, data, paper) from the fields `machinechecked.toml` allows.
      - name: Build the audit
        run: |
          pip install "machinechecked==${{ matrix.machinechecked }}"
          machinechecked build
          machinechecked export --out "$RUNNER_TEMP/audit"
          test -f "$RUNNER_TEMP/audit/audit.json"

      - uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.audit }}
          path: ${{ runner.temp }}/audit
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: audit-*
          path: audits

      # /v1/ and /latest/, and the latest audit again at the root.
      - name: Assemble the site
        run: |
          mkdir site
          mv audits/audit-v1 site/v1
          mv audits/audit-latest site/latest
          cp -R site/latest/. site/
          test -f site/v1/audit.json && test -f site/latest/audit.json && test -f site/audit.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
