name: Audit

# The MachineChecked audit of this repository, published to its GitHub Pages after CI passes on
# main (or on a manual run). machinechecked.org reads it from there, so each push to main updates
# the published audit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | \
            sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/node_modules
          df -h /

      # The build CI published for this commit, from the `build-cache` release; anything it
      # lacks is rebuilt.
      - name: Restore the build
        env:
          PROOFLENS_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/lean_cache.py" \
            https://raw.githubusercontent.com/cgarryZA/MachineChecked/2d577fda5c42713980c3dafe6c46560c02e3330d/scripts/lean_cache.py
          lake exe cache get
          python3 "$RUNNER_TEMP/lean_cache.py" restore . "${{ github.repository }}" \
            || echo "no compatible cached build; building from source"
          lake build --rehash

      - name: Install TeX Live
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended lmodern latexmk poppler-utils

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `build` probes the built Lean and compiles the manuscript; `export` writes the public
      # audit (reader, data, paper) from the fields `machinechecked.toml` allows.
      - name: Build the audit
        run: |
          pip install "machinechecked==0.1.5"
          machinechecked build
          machinechecked export --out _audit

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _audit

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
