name = "MVFBSDEJWellPosedness"
version = "0.1.0"
keywords = ["math", "probability", "FBSDE", "McKean-Vlasov", "jumps"]
description = "Well-posedness of fully coupled McKean-Vlasov FBSDEs with jumps, in Lean 4."
homepage = "https://github.com/cgarryZA/mvfbsdej-well-posedness-lean"
license = "Apache-2.0"
licenseFiles = ["LICENSE"]
readmeFile = "README.md"
defaultTargets = ["Dissertation"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "81a5d257c8e410db227a6665ed08f64fea08e997"

[[require]]
name = "LevyStochCalc"
git = "https://github.com/cgarryZA/LevyStochCalc"
rev = "e88d0e4d3a645fb45ddd4ae81c08890bc2b6cd87"

[[lean_lib]]
name = "Dissertation"
globs = ["Dissertation.*"]

# the challenge module that tools/acceptance.py comparator-inputs writes for comparator
[[lean_lib]]
name = "AcceptanceChallenge"
